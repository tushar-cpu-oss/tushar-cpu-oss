name: Update Dev Quest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get contribution count
        id: contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d '{"query":"query { user(login: \"tushar-cpu-oss\") { contributionsCollection { contributionCalendar { totalContributions } } } }"}')

          TOTAL=$(echo "$RESPONSE" | jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          if [ "$TOTAL" = "null" ] || [ -z "$TOTAL" ]; then
            echo "$RESPONSE"
            exit 1
          fi

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Generate Dev Quest
        env:
          CONTRIBUTIONS: ${{ steps.contributions.outputs.total }}
        run: node scripts/generate-quest.js

      - name: Commit updated quest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/dev-quest.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Dev Quest"
            git push
          fi
